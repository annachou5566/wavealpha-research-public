name: Historical mining source integration
on:
  # Manual only: external source contract is unresolved (R13 SOURCE HOLD).
  # Do not launch on pushes or schedules; retain fail-closed data validation.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: historical-mining-source
  cancel-in-progress: false
jobs:
  source-regression:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 mining_source_regression.py
